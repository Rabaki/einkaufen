<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Einkaufsliste</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131d2e;
      --card-hover: #1c2b42;
      --border: #23334d;
      --text-main: #f8fafc;
      --text-muted: #8494ab;
      
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-green-subtle: rgba(16, 185, 129, 0.15);

      --danger: #f87171;
      --danger-hover-bg: rgba(239, 68, 68, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* Fester Kopfbereich oben: Header + Eingabefeld bleiben immer sichtbar */
    .top-section {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 13, 22, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title .icon {
      font-size: 1.4rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .item-counter {
      font-size: 0.8rem;
      color: var(--accent-green);
      font-weight: 600;
      background-color: var(--accent-green-subtle);
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Eingabezeile */
    .input-form {
      display: flex;
      gap: 10px;
    }

    /* Mindestens 16px verhindert den störenden automatischen Safari-Zoom */
    input[type="text"] {
      flex: 1;
      background-color: #131d2e;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 2px var(--accent-green-subtle);
    }

    input[type="text"]::placeholder {
      color: #63758e;
    }

    button.btn-add {
      background-color: var(--accent-green);
      color: #032018;
      border: none;
      border-radius: 12px;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.15s, transform 0.1s;
    }

    button.btn-add:active {
      background-color: var(--accent-green-hover);
      transform: scale(0.96);
    }

    /* Scrollbare Liste: passt sich dynamisch an, wenn Tastatur aufklappt */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      -webkit-overflow-scrolling: touch;
    }

    ul.item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li.item {
      display: flex;
      align-items: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 54px;
      transition: background-color 0.15s;
    }

    li.item:active {
      background-color: var(--card-hover);
    }

    .item-content {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
    }

    /* Touch-optimierte Checkbox */
    .item-content input[type="checkbox"] {
      appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid #506482;
      border-radius: 7px;
      background-color: transparent;
      cursor: pointer;
      display: grid;
      place-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .item-content input[type="checkbox"]:checked {
      border-color: var(--accent-green);
      background-color: var(--accent-green);
    }

    .item-content input[type="checkbox"]:checked::before {
      content: "✓";
      color: #032018;
      font-size: 16px;
      font-weight: 900;
    }

    .item-text {
      font-size: 1.05rem;
      line-height: 1.4;
      word-break: break-word;
      transition: color 0.15s, opacity 0.15s;
    }

    li.completed .item-text {
      text-decoration: line-through;
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* Löschen-Taste */
    button.btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 50px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
      flex-shrink: 0;
    }

    button.btn-delete:active {
      color: var(--danger);
      background-color: var(--danger-hover-bg);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- Oben fixiert: Header + Eingabefeld bleiben immer im Blick -->
    <div class="top-section">
      <header>
        <div class="header-title">
          <span class="icon">🛒</span>
          <h1>Einkaufsliste</h1>
        </div>
        <div class="item-counter" id="itemCounter">0 offen</div>
      </header>

     <form class="input-form" id="inputForm">
  <input 
    type="text" 
    id="itemInput" 
    placeholder="Artikel eingeben & mit Return bestätigen..." 
    enterkeyhint="done"
    autocomplete="off"
  >
</form>
    </div>

    <!-- Scrollbarer Bereich -->
    <main id="mainContainer">
      <ul class="item-list" id="itemList"></ul>
      <div class="empty-state" id="emptyState">
        Deine Liste ist leer.<br>
        Tippe oben auf das Feld, um Artikel hinzuzufügen.
      </div>
    </main>
  </div>

  <script>
    const itemInput = document.getElementById('itemInput');
    const inputForm = document.getElementById('inputForm');
    const itemList = document.getElementById('itemList');
    const emptyState = document.getElementById('emptyState');
    const itemCounter = document.getElementById('itemCounter');
    const mainContainer = document.getElementById('mainContainer');

    let items = JSON.parse(localStorage.getItem('mobile_shopping_v2')) || [];

    function saveItems() {
      localStorage.setItem('mobile_shopping_v2', JSON.stringify(items));
    }

    function updateCounter() {
      const openCount = items.filter(item => !item.completed).length;
      itemCounter.textContent = `${openCount} offen`;
    }

    function renderList() {
      itemList.innerHTML = '';
      updateCounter();

      if (items.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `item ${item.completed ? 'completed' : ''}`;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'item-content';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.completed;
        checkbox.setAttribute('aria-label', item.text);

        const span = document.createElement('span');
        span.className = 'item-text';
        span.textContent = item.text;

        contentDiv.appendChild(checkbox);
        contentDiv.appendChild(span);

        contentDiv.addEventListener('click', () => toggleItem(index));

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete';
        deleteBtn.innerHTML = '✕';
        deleteBtn.setAttribute('aria-label', `Lösche ${item.text}`);
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteItem(index);
        });

        li.appendChild(contentDiv);
        li.appendChild(deleteBtn);
        itemList.appendChild(li);
      });
    }

    function addItem(e) {
      e.preventDefault();
      const text = itemInput.value.trim();
      if (!text) return;

      // Neues Item wird ganz OBEN eingefügt (unshift), damit es direkt unter dem Eingabefeld steht
      items.unshift({ text: text, completed: false });
      saveItems();
      renderList();

      itemInput.value = '';
      itemInput.focus();

      // Sofort ganz nach oben scrollen, damit das frische Item sofort im sichtbaren Bereich ist
      mainContainer.scrollTop = 0;
    }

    function toggleItem(index) {
      items[index].completed = !items[index].completed;
      saveItems();
      renderList();
    }

    function deleteItem(index) {
      items.splice(index, 1);
      saveItems();
      renderList();
    }

    inputForm.addEventListener('submit', addItem);
    renderList();
  </script>
</body>
</html>
